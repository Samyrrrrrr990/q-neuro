[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "q-neuro"
version = "1.0.0"
description = "Falsification-first evaluation of complex and exact-real sequential models on synthetic tasks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "psutil>=6,<8",
  "pyyaml>=6,<7",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
paper = [
  "pillow>=11,<13",
  "python-docx>=1.1,<2",
  # 5.x strips <b>/<i>/<font> out of Paragraph markup, so the plain-language PDFs lose every
  # emphasis and every Unicode fallback span. Pinned below it deliberately.
  "reportlab>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["qneuro", "neuroworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
