[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "q-neuro"
version = "0.1.0"
description = "Research framework for hypothesis-state computing in synthetic neurological reasoning"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "psutil>=6,<8",
  "pyyaml>=6,<7",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["qneuro", "neuroworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
