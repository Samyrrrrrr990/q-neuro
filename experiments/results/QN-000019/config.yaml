experiment: hierarchical_observable_probe
description: Frozen-state evaluation of emergent mechanism, localization, temporality,
  and context structure using identical linear probes and Hermitian quadratic observables
  where the state is complex.
source_experiment: QN-000014
models:
  names:
  - logistic
  - mlp
  - complex_mlp
  - transformer
  - gru
  - state_space
  - hopfield
  - graph_network
  - coupled_tensor
  - real_operator
  - two_channel_operator
  - complex_operator
  - energy_attractor
  - adaptive_attractor
  - hamiltonian
  - dissipative
  - hybrid_dynamics
  - density_dynamics
  hermitian_observable_models:
  - complex_operator
  - hamiltonian
  - hybrid_dynamics
probe:
  epochs: 250
  learning_rate: 0.03
  weight_decay: 0.001
  properties:
    mechanism: 5
    localization: 4
    temporality: 3
    context: 4
evaluation:
  batch_size: 128
  device: cpu
