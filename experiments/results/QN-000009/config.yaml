experiment: neuro_task_suite
description: Orthogonal NeuroWorld evaluation suite covering held-out evidence compositions,
  irreducible ambiguity, a completely unseen disease class, and an unlabeled hidden
  syndrome. [SMOKE PROFILE]
world:
  world_seed: 314159
  observation_probability: 0.72
  probability_mixing: 0.0
  temporal_jitter: 0.025
  order_marker_visibility: 1.0
models:
  names:
  - mlp
  - transformer
  - gru
  - real_operator
  - two_channel_operator
  - complex_operator
  parameter_budget: 20000
  operator_rank: 2
  step_size: 0.35
  max_sequence_length: 40
  learning_rates:
    mlp:
    - 0.003
    transformer:
    - 0.003
    gru:
    - 0.006
    real_operator:
    - 0.003
    two_channel_operator:
    - 0.003
    complex_operator:
    - 0.003
training:
  seeds:
  - 11
  batch_size: 128
  epochs: 2
  patience: 2
  learning_rate: 0.003
  weight_decay: 0.0001
  device: cpu
evaluation:
  calibration_bins: 10
tasks:
  base:
    train_cases: 300
    validation_cases: 100
    test_cases: 120
    ambiguity_pairs: 30
    hidden_syndrome_cases: 40
  composition:
    train_cases: 300
    validation_cases: 100
    test_cases: 120
    reference_cases: 120
  unknown_disease:
    heldout_label: 19
    train_cases: 300
    validation_cases: 100
    id_test_cases: 120
    ood_test_cases: 80
