name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install project
        run: uv sync --extra dev --frozen
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Verify generated dashboard payload
        run: |
          make dashboard
          git diff --exit-code -- dashboard/data.js
